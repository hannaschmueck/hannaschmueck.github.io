<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Countdown</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
      .countdown-wrap { max-width: 480px; }
      .countdown-event { margin-bottom: 1.5em; }
      .countdown-track {
        background: rgba(75, 75, 75, 0.085);
        border-radius: 999px;
        height: 18px;
        overflow: hidden;
        margin-bottom: 0.6em;
      }
      .countdown-bar {
        height: 100%;
        border-radius: 999px;
        background: #282828;
        transition: width 1s linear;
        min-width: 2px;
      }
      .countdown-bar.accent { background: #a89cee; }
      .countdown-bar.accent2 { background: #f5a9b8; }
      .countdown-meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .countdown-time {
        font-size: 1.2em;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.03em;
        color: #999292;
      }
      .countdown-pct {
        font-size: 0.95em;
        opacity: 0.5;
        color: #0e0e0e;
      }
      .countdown-divider {
        border: none;
        border-top: 1px solid rgba(255,255,255,0.1);
        margin: 1.5em 0;
      }
      
    </style>
  </head>
  <body class="is-preload">

    <!-- Header -->
    <header id="header">
      <div class="inner">
        <h1 style="font-size: 5vw;"><strong>♡</strong></h1>
      </div>
    </header>

    <!-- Main -->
    <div id="main">
      <section id="one">
        <div class="countdown-wrap">

          <div class="countdown-event">
            <div class="countdown-track">
              <div class="countdown-bar accent" id="bar1"></div>
            </div>
            <div class="countdown-meta">
              <span class="countdown-time" id="cd1">—</span>
              <span class="countdown-pct" id="pct1"></span>
            </div>
          </div>

        </div>
      </section>
    </div>

    <script>
      var start = new Date("July 22, 2026 14:47:00").getTime();
      var end1  = new Date("Aug 08, 2026 13:55:00").getTime();

      function fmt(ms) {
        if (ms <= 0) return "we made it";
        var s = Math.floor(ms / 1000);
        var d = Math.floor(s / 86400);
        var h = Math.floor((s % 86400) / 3600);
        var m = Math.floor((s % 3600) / 60);
        var sc = s % 60;
        return d + "d " + h + "h " + m + "m " + String(sc).padStart(2, "0") + "s";
      }

      function tick() {
        var now = Date.now();
        var elapsed = now - start;
        var p1 = Math.min(100, Math.max(0, (elapsed / (end1 - start)) * 100));


        document.getElementById("bar1").style.width = p1.toFixed(2) + "%";
        document.getElementById("pct1").textContent = p1.toFixed(4) + "%";
        document.getElementById("cd1").textContent = fmt(end1 - now);
      }

      tick();
      setInterval(tick, 1000);
    </script>

  </body>
</html>
