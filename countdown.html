           <div class="m-4">

</div>
<h2> </h2>
<div class="progress">
  <div class="progress" style="background-color: #e9ecef;"> 
    <div class="progress-bar progress-bar-striped progress-bar-animated" id="progress-bar" style="min-width: 20px; background-color: #333; color: #fff; font-size: 0.8em;"></div></div>
</div>
<p id="demo"></p>

<div class="progress mt-2">
  <div class="progress" style="background-color: #e9ecef;"> 
    <div class="progress-bar progress-bar-striped progress-bar-animated" id="progress-bar-2" style="min-width: 20px; background-color: #333; color: #fff; font-size: 0.8em;"></div></div>
</div>
<p id="demo2"></p>

<br>


<script>
// Set the start time and countdown target
var startTime = new Date("June 23, 2026 08:30:00").getTime();
var countDownDate = new Date("Aug 08, 2026 13:55:00").getTime();

var countDownDate2 = new Date("Jul 10, 2026 18:00:00").getTime();

// Update the count down every 1 second
var x = setInterval(function() {
  var now = new Date().getTime();
  var distance = now - startTime;
  var countDownDistance = countDownDate - now;

  var percentage = (distance / (countDownDate - startTime)) * 100;
  var percentage2 = (distance / (countDownDate2 - startTime)) * 100;
    
  // Update the progress bar
  var progressBar = document.getElementById("progress-bar");
  progressBar.style.width = percentage + "%";
  progressBar.innerText = percentage.toFixed(2) + "%";
    

  var progressBar2 = document.getElementById("progress-bar-2");
progressBar2.style.width = percentage2 + "%";
progressBar2.innerText = percentage2.toFixed(2) + "%";

  // Time calculations for days, hours, minutes and seconds
var distance1 = Math.floor(countDownDistance / 1000); // convert ms → seconds

var days    = Math.floor(distance1 / (60 * 60 * 24));
var hours   = Math.floor((distance1 % (60 * 60 * 24)) / (60 * 60));
var minutes = Math.floor((distance1 % (60 * 60)) / 60);
var seconds = Math.floor(distance1 % 60);

// Display the remaining time
var countdownElement = document.getElementById("demo");
countdownElement.innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";


var countDownDistance2 = countDownDate2 - now;
var distance2 = Math.floor(countDownDistance2 / 1000);
var days2    = Math.floor(distance2 / (60 * 60 * 24));
var hours2   = Math.floor((distance2 % (60 * 60 * 24)) / (60 * 60));
var minutes2 = Math.floor((distance2 % (60 * 60)) / 60);
var seconds2 = Math.floor(distance2 % 60);

document.getElementById("demo2").innerHTML = days2 + "d " + hours2 + "h " + minutes2 + "m " + seconds2 + "s ";

}, 1000)

</script>
